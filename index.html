<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Supermercado 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: lienzo 3D a pantalla completa; ficha de opción arriba, barra de opciones y vistas abajo */
:root{
  --bg:#e9ecef; --panel:rgba(255,255,255,.93); --fg:#15171c; --muted:#5b6170;
  --line:rgba(21,23,28,.12); --accent:#2337c6; --sign:#f5c518; --ok:#1f8a4c; --warn:#b5530f;
  --display:"Archivo",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14161b; --panel:rgba(24,27,34,.92); --fg:#eef0f4; --muted:#a2a8b6; --line:rgba(255,255,255,.14); --accent:#7d8cff; --ok:#4cc781; --warn:#f0954f; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14161b; --panel:rgba(24,27,34,.92); --fg:#eef0f4; --muted:#a2a8b6; --line:rgba(255,255,255,.14); --accent:#7d8cff; --ok:#4cc781; --warn:#f0954f; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--display);overflow:hidden}
#stage{position:fixed;inset:0}
#stage canvas{display:block;touch-action:none}
.card{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));
  background:var(--panel);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:10px;padding:12px 14px;
  width:min(330px,calc(100vw - 32px));display:flex;flex-direction:column;gap:8px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.eyebrow{font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center}
.eyebrow i{width:10px;height:10px;background:var(--sign);display:inline-block;border-radius:2px}
h1{margin:4px 0 0;font-size:19px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stat{border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
.stat b{display:block;font:500 15px/1.1 var(--mono);font-variant-numeric:tabular-nums}
.stat span{font:400 10px/1.2 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.stat.ok b{color:var(--ok)} .stat.warn b{color:var(--warn)}
.pc{font-size:12.5px;line-height:1.45;margin:0;padding-left:16px}
.pc li::marker{font-weight:700}
.pc .p::marker{content:"+  ";color:var(--ok)} .pc .c::marker{content:"–  ";color:var(--warn)}
.slider{display:flex;align-items:center;gap:8px;font:400 11px/1 var(--mono);color:var(--muted)}
.slider input{flex:1;accent-color:var(--accent)}
.slider output{font-variant-numeric:tabular-nums;color:var(--fg);min-width:48px;text-align:right}
.note{font:400 10.5px/1.4 var(--mono);color:var(--muted)}
.collapse{font:600 11px/1 var(--mono);padding:6px 8px}
.card .body{display:flex;flex-direction:column;gap:8px}
.card.min .body{display:none}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px;backdrop-filter:blur(8px)}
.row .lbl{font:500 10px/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);align-self:center;padding:0 6px}
button{font:600 13px/1 var(--display);color:var(--fg);background:transparent;border:1px solid transparent;border-radius:8px;padding:9px 11px;cursor:pointer}
button:hover{border-color:var(--line)}
button[aria-pressed="true"]{background:var(--accent);color:#fff}
.opt[aria-pressed="true"]{background:var(--sign);color:#15171c}
.hint{font:500 11.5px/1.3 var(--mono);color:#15171c;background:var(--sign);padding:7px 12px;border-radius:999px;text-align:center;pointer-events:auto}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>

<div id="stage"></div>

<div class="card" id="card">
  <div class="head">
    <div>
      <div class="eyebrow"><i></i><span id="eb">Cigarrera BAT</span></div>
      <h1 id="optTitle">Posición libre</h1>
    </div>
    <button class="collapse" id="collapse" aria-expanded="true">Ocultar</button>
  </div>
  <div class="body">
    <div class="stats">
      <div class="stat" id="sDist"><b id="vDist">–</b><span>Cajero ↔ rack</span></div>
      <div class="stat" id="sTop"><b id="vTop">–</b><span>Borde superior</span></div>
      <div class="stat"><b id="vVis">–</b><span>Frente mira a</span></div>
    </div>
    <ul class="pc" id="pc"></ul>
    <label class="slider" for="hBase">Altura base
      <input type="range" id="hBase" min="1.0" max="1.9" step="0.05" value="1.25">
      <output id="hOut">1.25 m</output>
    </label>
    <div class="note" id="note"></div>
  </div>
</div>

<div class="bar">
  <div class="hint" id="mvHint" hidden>Arrastra la cigarrera sobre el piso · toca Mover otra vez para girar la cámara</div>
  <div class="row" role="toolbar" aria-label="Ubicación de la cigarrera">
    <span class="lbl">Ubicación</span>
    <span class="lbl">Modelo</span>
    <button class="opt" id="m-simple" data-model="simple" aria-pressed="true">P4</button>
    <button class="opt" id="m-transf" data-model="transformer" aria-pressed="false">Transformer</button>
    <button class="opt" id="m-prosep" data-model="prosep" aria-pressed="false">Prosep</button>
    <button id="mv" aria-pressed="false">Mover</button>
    <button id="rl" aria-label="Girar 45 grados a la izquierda">↺ 45°</button>
    <button id="rr" aria-label="Girar 45 grados a la derecha">↻ 45°</button>
  </div>
  <div class="row" role="toolbar" aria-label="Vistas">
    <button id="v-gen" data-view="general" aria-pressed="true">General</button>
    <button id="v-cli" data-view="cliente">Cliente</button>
    <button id="v-caj" data-view="cajero">Ojos cajera</button>
    <button id="v-rack" data-view="rack">Posterior</button>
    <button id="v-lat" data-view="lateral">Lateral</button>
    <button id="v-pla" data-view="planta">Planta</button>
    <button id="t-prod" aria-pressed="false">Productos</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05;
stage.appendChild(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0xdfe6ee);
const camera=new THREE.PerspectiveCamera(55,1,0.05,200);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.maxPolarAngle=Math.PI*0.495; controls.minDistance=0.6; controls.maxDistance=60;

// ---------- Materiales ----------
const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.6,metalness:0},o));
const mat={
  blue:M(0x1f2fc4,{roughness:.35}), dark:M(0x2a2c31,{roughness:.5}), black:M(0x121316,{roughness:.45,metalness:.2}),
  steel:M(0x9aa0a8,{metalness:.6,roughness:.35}), shelf:M(0x6e737b,{metalness:.4,roughness:.45}),
  white:M(0xf4f5f7,{roughness:.8}), truss:M(0xf2f3f5,{roughness:.5}), yellow:M(0xf5c518,{roughness:.5}),
  glass:new THREE.MeshPhysicalMaterial({color:0xcfe6ef,roughness:.05,transparent:true,opacity:.45}),
  lightBar:M(0x111111), lightOn:new THREE.MeshBasicMaterial({color:0xffffff}), pallet:M(0xb7672f,{roughness:.9}),
  red:M(0xc8201e), sky:new THREE.MeshBasicMaterial({color:0xcfe8ff}), screen:M(0xffffff,{emissive:0xdfe8ff,emissiveIntensity:.3})
};
function box(w,h,d,m,x,y,z,parent=scene,shadow=true){
  const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m); b.position.set(x,y,z);
  b.castShadow=shadow; b.receiveShadow=true; parent.add(b); return b;
}

// ---------- Piso y muros ----------
const W=34, D=28, H=7.5, Z0=-4;
(function(){
  const c=document.createElement('canvas'); c.width=c.height=256; const g=c.getContext('2d');
  g.fillStyle='#ece3d4'; g.fillRect(0,0,256,256);
  for(let i=0;i<40;i++){g.fillStyle=`rgba(255,255,255,${Math.random()*.08})`;g.fillRect(Math.random()*256,Math.random()*256,40,40);}
  g.strokeStyle='#d6cbb9'; g.lineWidth=3; g.strokeRect(0,0,256,256);
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(W/0.8,D/0.8); t.encoding=THREE.sRGBEncoding;
  t.anisotropy=renderer.capabilities.getMaxAnisotropy();
  const f=new THREE.Mesh(new THREE.PlaneGeometry(W,D),new THREE.MeshStandardMaterial({map:t,roughness:.18,metalness:.05}));
  f.rotation.x=-Math.PI/2; f.position.z=Z0; f.receiveShadow=true; scene.add(f);
  const out=new THREE.Mesh(new THREE.PlaneGeometry(120,120),M(0xc9ced4)); out.rotation.x=-Math.PI/2; out.position.y=-0.01; scene.add(out);
})();
// Muros de una sola cara (miran hacia adentro): al girar la cámara por fuera, se ven a través
const wallMat=new THREE.MeshStandardMaterial({color:0xf4f5f7,roughness:.8,side:THREE.FrontSide});
const wall=(w,x,z,ry)=>{const p=new THREE.Mesh(new THREE.PlaneGeometry(w,H),wallMat);p.position.set(x,H/2,z);p.rotation.y=ry;p.receiveShadow=true;scene.add(p);};
wall(W,0,Z0+D/2,Math.PI); wall(D,-W/2,Z0,Math.PI/2); wall(D,W/2,Z0,-Math.PI/2);
box(1.8,2.4,0.05,M(0xe2e4e8),11,1.2,Z0+D/2-0.12);

// ---------- Techo ----------
const roofY=H;
const ceil=new THREE.Mesh(new THREE.PlaneGeometry(W,D),mat.white); ceil.rotation.x=Math.PI/2; ceil.position.set(0,roofY+0.6,Z0); scene.add(ceil);
const sky=new THREE.Mesh(new THREE.PlaneGeometry(W,4),mat.sky); sky.rotation.x=Math.PI/2; sky.position.set(0,roofY+0.58,2); scene.add(sky);
for(let z=Z0-D/2+1.5; z<Z0+D/2; z+=3){
  box(W,0.18,0.18,mat.truss,0,roofY-0.4,z,scene,true);
  box(W,0.12,0.12,mat.truss,0,roofY+0.4,z,scene,true);
  for(let x=-W/2+1; x<W/2; x+=2){ const d=box(0.08,1.1,0.08,mat.truss,x,roofY,z,scene,true); d.rotation.z=(Math.floor(x)%4===0?1:-1)*0.75; }
}
for(let x=-W/2+2; x<W/2; x+=4) box(0.12,0.12,D,mat.truss,x,roofY+0.4,Z0,scene,false);
for(let z=-16; z<=8; z+=3.5){
  box(W-4,0.06,0.1,mat.lightBar,0,5.6,z,scene,false);
  const s=new THREE.Mesh(new THREE.PlaneGeometry(W-4.1,0.06),mat.lightOn); s.rotation.x=Math.PI/2; s.position.set(0,5.565,z); scene.add(s);
}

// ---------- Góndolas ----------
const shelves=[];
function gondola(x,z,len,rotY,double=true,h=2.1){
  const g=new THREE.Group(); g.position.set(x,0,z); g.rotation.y=rotY; scene.add(g);
  const dep=double?0.9:0.45;
  box(len,0.12,dep,mat.dark,0,0.06,0,g);
  box(len,h,0.04,mat.shelf,0,h/2,double?0:-dep/2+0.02,g);
  for(let u=-len/2; u<=len/2+0.01; u+=1) box(0.05,h,dep*0.95,mat.shelf,u,h/2,0,g);
  const sides=double?[1,-1]:[1];
  [0.15,0.55,0.95,1.35,1.75].forEach(y=>sides.forEach(s=>{
    const sd=double?dep/2:dep-0.04, cz=double?s*sd/2:0.02;
    const sh=box(len,0.03,sd-0.02,mat.shelf,0,y,cz,g); sh.userData={len,depth:sd-0.02}; shelves.push(sh);
  }));
}
gondola(-W/2+0.35,3,12,Math.PI/2,false,2.3);
gondola(-3,Z0+D/2-0.35,18,Math.PI,false,2.3);
gondola(10,Z0+D/2-0.35,4,Math.PI,false,2.3);
[-9.5,-6.5,-3.5,-0.5,2.5].forEach(x=>gondola(x,4.6,7,Math.PI/2,true));
gondola(W/2-0.35,3,8,-Math.PI/2,false,2.3);

for(let i=0;i<2;i++){
  const g=new THREE.Group(); g.position.set(-11.5,0,-0.6+i*2.2); scene.add(g);
  box(2.4,0.8,1.2,mat.dark,0,0.4,0,g);
  const t=box(2.4,0.05,1.2,mat.shelf,0,0.85,0,g); t.rotation.x=-0.15;
}

// ---------- Congelados ----------
function freezer(x,z,len){
  const g=new THREE.Group(); g.position.set(x,0,z); scene.add(g);
  box(len,0.75,1.9,mat.white,0,0.375,0,g);
  box(len+0.01,0.14,1.91,mat.yellow,0,0.62,0,g,false);
  box(len,0.06,1.9,mat.steel,0,0.78,0,g);
  box(len-0.1,0.02,1.8,mat.glass,0,0.88,0,g,false);
  for(let i=-1;i<=1;i+=2) box(len,0.1,0.04,mat.steel,0,0.85,i*0.93,g);
}
freezer(8.5,0.2,3.6); freezer(8.5,2.4,3.6); freezer(12.5,0.2,2.4);

// ---------- Cajas ----------
// La cajera se ubica al lado izquierdo (−x) del módulo; el cliente pasa por el lado derecho (+x).
function checkout(x,z){
  const g=new THREE.Group(); g.position.set(x,0,z); scene.add(g);
  box(0.9,0.85,1.2,mat.blue,0,0.425,-0.9,g);
  box(0.9,0.85,1.8,mat.blue,0,0.425,0.6,g);
  box(0.98,0.06,1.25,mat.steel,0,0.88,-0.9,g);
  box(0.98,0.06,1.85,mat.dark,0,0.88,0.6,g);
  box(0.06,0.6,1.8,mat.dark,-0.45,1.2,0.6,g);
  const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,0.45,12),mat.white); pole.position.set(-0.2,1.13,-1.05); g.add(pole);
  const scr=box(0.03,0.28,0.38,mat.screen,-0.22,1.45,-1.05,g); scr.rotation.z=0.25;
  box(0.9,1.3,0.35,mat.dark,0,0.65,1.7,g);
  for(let y=0.35;y<1.3;y+=0.3) box(0.86,0.02,0.33,mat.shelf,0,y,1.72,g);
}
[-12,-9.8,-7.6,-5.4].forEach(x=>checkout(x,-5.5));

for(let i=0;i<2;i++){
  const g=new THREE.Group(); g.position.set(-W/2+1.1,0,-12+i*1.2); scene.add(g);
  box(1.0,0.9,0.6,new THREE.MeshStandardMaterial({color:0x8e939b,metalness:.6,roughness:.3,wireframe:true}),0,0.55,0,g);
  box(1.0,0.05,0.6,mat.yellow,0,0.95,0,g);
}
const ext=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,0.55,16),mat.red); ext.position.set(-W/2+0.2,1.2,-3); scene.add(ext);
for(let i=0;i<3;i++) box(1.2,0.14,1.0,mat.pallet,W/2-1.2,0.07,5.5+i*1.15);

// ---------- Señalética ----------
function sign(text,icon,x,z,rotY,y=3.6){
  const c=document.createElement('canvas'); c.width=1024; c.height=256; const g=c.getContext('2d');
  g.fillStyle='#f5c518'; g.fillRect(0,0,1024,256);
  g.fillStyle=icon; g.beginPath(); g.arc(128,128,70,0,Math.PI*2); g.fill();
  g.fillStyle='#15171c'; g.font='800 84px Archivo, Arial, sans-serif'; g.textBaseline='middle';
  const words=text.split(' '); if(text.length>12&&words.length>1){g.fillText(words.slice(0,-1).join(' '),232,92);g.fillText(words[words.length-1],232,172);} else g.fillText(text,232,128);
  const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; t.anisotropy=8;
  const m=new THREE.MeshStandardMaterial({map:t,roughness:.6});
  const grp=new THREE.Group(); grp.position.set(x,y,z); grp.rotation.y=rotY; scene.add(grp);
  box(2.4,0.6,0.05,M(0xf5c518),0,0,0,grp,false);
  [0.03,-0.03].forEach((o,i)=>{const p=new THREE.Mesh(new THREE.PlaneGeometry(2.36,0.59),m);p.position.z=o;if(i)p.rotation.y=Math.PI;grp.add(p);});
  [-0.9,0.9].forEach(dx=>box(0.01,roofY-0.4-y,0.01,mat.dark,dx,(roofY-0.4-y)/2+0.3,0,grp,false));
}
[['Frutas y Verduras','#3aa845',-11.2,0],['Abarrotes','#d23a2b',-9.5,0.6],['Lácteos','#2a7bd5',-6.5,0.6],
 ['Snacks','#e8742a',-3.5,0.6],['Bebidas','#c8201e',-0.5,0.6],['Congelados','#2aa5d5',9.8,-1.4],['Limpieza','#7c49c9',W/2-1.2,3]
].forEach(([t,c,x,z])=>sign(t,c,x,z,0));

// ---------- Personas ----------
function person(shirt,pants,{hair=0x1b1410,skin=0xb57a52,h=1.55,arm=0}={}){
  const g=new THREE.Group(); const k=h/1.62;
  const S=(geo,m,x,y,z)=>{const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.castShadow=true;g.add(o);return o;};
  const ms=M(shirt),mp=M(pants),mk=M(skin),mh=M(hair);
  [-0.09,0.09].forEach(x=>{S(new THREE.CylinderGeometry(0.07,0.06,0.8,10),mp,x,0.4,0); S(new THREE.BoxGeometry(0.1,0.06,0.22),mat.black,x,0.03,0.04);});
  const t=S(new THREE.CylinderGeometry(0.17,0.15,0.62,14),ms,0,1.11,0); t.scale.z=0.62;
  S(new THREE.BoxGeometry(0.06,0.08,0.01),M(0xf5c518),0.08,1.25,0.1);           // fotocheck (marca el frente)
  [-1,1].forEach(s=>{
    const a=S(new THREE.CylinderGeometry(0.045,0.04,0.58,10),ms,s*0.21,1.1,0);
    a.rotation.z=s*0.08; if(arm&&s===1){a.rotation.x=-arm; a.position.z=0.12; a.position.y=1.2;}
  });
  S(new THREE.CylinderGeometry(0.05,0.05,0.08,10),mk,0,1.45,0);
  S(new THREE.SphereGeometry(0.11,20,16),mk,0,1.55,0.01);
  const hr=S(new THREE.SphereGeometry(0.115,20,12,0,Math.PI*2,0,Math.PI*0.55),mh,0,1.565,-0.01); hr.rotation.x=-0.25;
  g.scale.setScalar(k); scene.add(g); return g;
}
const faceTo=(g,dx,dz)=>{g.rotation.y=Math.atan2(dx,dz);};
const cashierPos=new THREE.Vector3(-12.78,0,-6.35);
const cashier=person(0x1f2fc4,0x22252c,{h:1.55}); cashier.position.copy(cashierPos); faceTo(cashier,1,0);
const client=person(0x8a3b2f,0x3b4a66,{h:1.68,hair:0x2b2018}); client.position.set(-10.9,0,-4.2); faceTo(client,0,-1);
const client2=person(0x3f7f5a,0x2d2d33,{h:1.6,hair:0x120d0a}); client2.position.set(-10.9,0,-2.9); faceTo(client2,0,-1);

// ---------- Cigarrera P4: caja negra con lightbox frontal, cajón inferior con candado, dorso calado y parante tubular ----------
const CW=0.40, CH=0.56, CD=0.24, LB=0.42;   // ancho, alto total, fondo, alto del lightbox
function posterTexture(){
  const c=document.createElement('canvas'); c.width=400; c.height=420; const g=c.getContext('2d');
  const gr=g.createRadialGradient(200,190,10,200,190,300); gr.addColorStop(0,'#eaf6ff'); gr.addColorStop(.18,'#7cc4ff'); gr.addColorStop(.55,'#1f5fd6'); gr.addColorStop(1,'#0b2a7a');
  g.fillStyle=gr; g.fillRect(0,0,400,420);
  g.strokeStyle='rgba(255,255,255,.35)'; g.lineWidth=1.5;

$('rl').addEventListener('click',()=>turn(Math.PI/4));
$('rr').addEventListener('click',()=>turn(-Math.PI/4));

$('collapse').addEventListener('click',e=>{const c=$('card'); const min=c.classList.toggle('min'); e.currentTarget.textContent=min?'Ver':'Ocultar'; e.currentTarget.setAttribute('aria-expanded',!min);});

// ---------- Productos ----------
const palette=[0xd23a2b,0xf2b705,0x2a7bd5,0x2f9e3a,0xe8742a,0xffffff,0x7c49c9,0x1d1d1d,0xe85d9a,0x55c2c9];
let prodMesh=null;
function buildProducts(){
  scene.updateMatrixWorld(true);
  const items=[]; const q=new THREE.Quaternion(), p=new THREE.Vector3();
  shelves.forEach(sh=>{
    const {len,depth}=sh.userData; let x=-len/2+0.08, col=0, run=0; const hgt=0.18+Math.random()*0.14;
    while(x<len/2-0.08){
      if(run--<=0){col=palette[Math.random()*palette.length|0]; run=3+Math.random()*6|0;}
      p.set(x,0.015+hgt/2,0); sh.localToWorld(p); sh.getWorldQuaternion(q);
      items.push({m:new THREE.Matrix4().compose(p.clone(),q.clone(),new THREE.Vector3(0.11,hgt,depth*0.85)),c:col}); x+=0.125;
    }
  });
  prodMesh=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshStandardMaterial({roughness:.5}),items.length);
  const color=new THREE.Color(); items.forEach((it,i)=>{prodMesh.setMatrixAt(i,it.m); prodMesh.setColorAt(i,color.setHex(it.c));});
  prodMesh.castShadow=true; scene.add(prodMesh);
}
$('t-prod').addEventListener('click',e=>{ if(!prodMesh) buildProducts(); else prodMesh.visible=!prodMesh.visible; e.currentTarget.setAttribute('aria-pressed',prodMesh.visible); });

// ---------- Luz ----------
scene.add(new THREE.HemisphereLight(0xffffff,0xd9cbb5,0.75));
const sun=new THREE.DirectionalLight(0xfff6e8,1.1); sun.position.set(-8,30,-6); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048); Object.assign(sun.shadow.camera,{left:-22,right:22,top:20,bottom:-20,near:1,far:70}); sun.shadow.bias=-0.0005;
scene.add(sun); scene.add(new THREE.AmbientLight(0xffffff,0.25));

// ---------- Vistas ----------
let activeView='general', tween=null;
function viewFor(name){
  cig.root.updateMatrixWorld(true);
  const hh=MODELS[model].h(); const c=new THREE.Vector3(cig.root.position.x,baseH+hh/2,cig.root.position.z);
  const f=frontDir(), side=new THREE.Vector3(f.z,0,-f.x);
  switch(name){
    case 'cliente': return {p:c.clone().addScaledVector(f,3.6).setY(1.6), t:c};
    case 'rack':    return {p:c.clone().addScaledVector(f,-1.6).setY(1.75), t:c.clone().setY(baseH+hh*0.45)};
    case 'lateral': return {p:c.clone().addScaledVector(side,3).addScaledVector(f,0.6).setY(1.8), t:c.clone().setY(1.1)};
    case 'cajero':  { const eye=cashierPos.clone().setY(1.45); const dir=c.clone().sub(eye).setY(0).normalize();
                      return {p:eye.clone().addScaledVector(dir,-0.05), t:c}; }
    case 'planta':  return {p:new THREE.Vector3(-10.5,9,-12.5), t:new THREE.Vector3(-10.5,0,-4.8)};
    default:        return {p:new THREE.Vector3(-15.3,2.9,-11.2), t:new THREE.Vector3(-10.5,1.2,-4.4)};
  }
}
function go(name,instant=false){
  activeView=name; const to=viewFor(name);
  cashier.visible = name!=='cajero';
  if(instant){camera.position.copy(to.p);controls.target.copy(to.t);tween=null;}
  else tween={fp:camera.position.clone(),ft:controls.target.clone(),to,k:0};
  document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===name));
}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.view)));
controls.addEventListener('start',()=>{tween=null; if(activeView==='cajero'){cashier.visible=true;}});
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.fov=w<600?70:55;camera.updateProjectionMatrix();}
addEventListener('resize',resize); resize();
cig.root.position.set(-13.0,0,-7.25); cig.root.rotation.y=Math.PI; cig.setBase(baseH); updateInfo(); go('general',true);

renderer.setAnimationLoop(()=>{
  if(tween){
    tween.k=Math.min(1,tween.k+(reduce?1:0.03)); const e=1-Math.pow(1-tween.k,3);
    camera.position.lerpVectors(tween.fp,tween.to.p,e); controls.target.lerpVectors(tween.ft,tween.to.t,e);
    if(tween.k>=1) tween=null;
  }
  controls.update(); renderer.render(scene,camera);
});
</script>
